{% extends "base.html" %}

{% block title %}
صفحه اصلی
{% endblock %}

{% block body %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
<h1>hello admin</h1>

    <section class="admin-dashboard-parent">
        <h2>اضافه کردن دکتر</h2>
        <form action="{{ url_for('admin.dashboard')}}" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="doctor_name" placeholder="نام">
            <input type="number" name="experience_years" placeholder="چند سال تجربه">
            <textarea name="biography" placeholder="بیوگرافی"></textarea>
            <input type="number" name="visit_price" placeholder="قیمت ویزیت">
            <input type="text" name="specials" placeholder="تخصص ها">
            <input type="file" name="profile_image">
            
            <input type="submit" value="ثبت دکتر">

        </form>
    </section>



    <section class="site-doctors">

        <h2>دکتر های کلینیک</h2>

        <div class="doctors-parent-admin">

            {% for doctor in doctors %}

            <div class="doctor-box">

                <div class="doctor-image">
                    <img src="{{ url_for('static', filename='doctor_profile/' ~ doctor.profile_image) }}"
                        alt="{{ doctor.doctor_name }}">
                </div>

                <h5>دکتر</h5>
                <div class="doctor-name">
                    <h3>{{ doctor.doctor_name }}</h3>
                </div>

                <div class="doctor-takhassos">
                    <h4>{{ doctor.specials }}</h4>
                </div>

            </div>

            {% endfor %}

        </div>

    </section>


<a href="{{ url_for('admin.logout') }}">خروج از حساب ادمین</a>


{% endblock %}
