{% extends "base.html" %}

{% block title %}
صفحه ثبت اطلاعات
{% endblock %}

{% block body %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">

<section class="user-register-parent">
    <h2>ثبت اطلاعات</h2>
    <p>برای دریافت نوبت اطلاعات زیر را کامل کنید</p>
    <form action="{{ url_for('user.register') }}" method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="fullname">نام و نام خانوادگی</label>
            <input type="text" id="fullname" name="fullname" value="{{ fullname or '' }}"placeholder="نام و نام خانوادگی"> <!--value باعث میشه اطلاعات در صورت خرابی رمز عبور پاک نشن-->
        </div>

        <div class="form-group">
            <label for="phone">شماره موبایل</label>
            <input type="tel" id="phone" name="phone" value="{{ phone or '' }}" placeholder="09123456789">
        </div>


        <div class="form-group">
            <label for="national_code">کد ملی</label>
            <input type="text" name="national_code" id="national_code" value="{{ national_code or '' }}" placeholder="کد ملی">
        </div>

        <button type="submit">ثبت اطلاعات</button>

    </form>
</section>

    <div>
        <h3>اگر قبلا ثبت نام کرده ای روی گزینه ورود کلیک کن </h3>
    <a href="{{ url_for('user.login_buy', schedule_id=schedule_id) }}">ورود</a>
    </div>




    {% endblock %}
